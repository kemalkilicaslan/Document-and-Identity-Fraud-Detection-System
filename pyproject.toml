[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docfraud"
version = "1.0.0"
description = "Document and identity fraud detection for savings-finance applications: field-level forgery CNN, MRZ/TCKN checks, point-in-time SQL features, rule engine and LightGBM hybrid score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-ND-4.0" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1",
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "duckdb>=1.0",
    "Faker>=24",
    "PyYAML>=6",
    "pillow>=10",
    "pytesseract>=0.3.10",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "markdown>=3.5",
    "tabulate>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: report templates and SQL strings; B008: FastAPI File()/Form() defaults; B905: zip() over equal-length columns
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# scripts import _bootstrap first so that src/ is on sys.path before docfraud
"scripts/*" = ["I001"]
